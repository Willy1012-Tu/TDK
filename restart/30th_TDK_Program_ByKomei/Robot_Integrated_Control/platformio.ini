[platformio]
default_envs = teensy40
core_dir = ../tmp/pio
cache_dir = ../tmp/c

[env]
platform = teensy@6.0.0
framework = arduino
upload_protocol = teensy-cli
extra_scripts = pre:tools/platformio_steps.py
monitor_speed = 115200
build_flags =
    -D USB_SERIAL
    -isystem lib/FlexCAN_T4
build_src_flags =
    -Wall
    -Wextra
    -Werror
lib_ldf_mode = chain+
monitor_echo = yes
monitor_eol = LF

[env:teensy40]
board = teensy40

[env:teensy41]
board = teensy41
