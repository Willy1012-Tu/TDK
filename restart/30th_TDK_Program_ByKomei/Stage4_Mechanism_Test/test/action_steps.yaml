steps:
  - actions:
      - servo: {pin: 2, pulse_us: 1500, duration_ms: 1000}
      - delay: {ms: 500}
      - stepper: {position: -400, rpm: 200, acc: 7}
      - servo: {pin: 5, pulse_us: 1700, duration_ms: 1000}
      - delay: {ms: 0}
  - actions:
      - delay: {ms: 60000}
      - servo: {pin: 2, pulse_us: 1300}
  - actions:
      - parallel:
          - servo: {pin: 5, pulse_us: 1900, duration_ms: 500}
          - stepper: {position: 100, rpm: 10}
      - delay: {ms: 100}
      - parallel:
          - servo: {pin: 2, pulse_us: 1800, duration_ms: 500}
          - servo: {pin: 5, pulse_us: 1500, duration_ms: 500}
