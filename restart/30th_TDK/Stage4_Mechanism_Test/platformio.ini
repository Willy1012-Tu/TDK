[platformio]
default_envs = teensy40
core_dir = ../tmp/pio
cache_dir = ../tmp/c

[env]
platform = teensy@6.0.0
framework = arduino
extra_scripts = pre:tools/platformio_steps.py
monitor_speed = 115200
build_flags =
    -D USB_SERIAL
lib_ldf_mode = chain+
monitor_echo = yes
monitor_eol = LF

[env:teensy40]
board = teensy40

[env:teensy41]
board = teensy41
