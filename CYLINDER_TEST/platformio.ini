[platformio]
default_envs = teensy40
src_dir = .

[env:teensy40]
platform = teensy@6.0.0
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
